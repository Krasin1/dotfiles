[terminal.shell]
program = "tmux"
args = ["new-session", "-A", "-s", "main"]


[window]
opacity = 0.9
padding.x = 10
padding.y = 10
decorations = "Full"
decorations_theme_variant = "Dark"


[scrolling]
history = 100000
multiplier = 3


[font]
builtin_box_drawing = true
size = 14.0
normal.family      = "CaskaydiaMono NFP"
bold.family        = "CaskaydiaMono NFP"
italic.family      = "CaskaydiaMono NFP"
bold_italic.family = "CaskaydiaMono NFP"


[keyboard]
bindings = [
  # Ctrl+Shift + HJKL
  { key = "H", mods = "Control|Shift", chars = "\u001b[104;6u" },
  { key = "J", mods = "Control|Shift", chars = "\u001b[106;6u" },
  { key = "K", mods = "Control|Shift", chars = "\u001b[107;6u" },
  { key = "L", mods = "Control|Shift", chars = "\u001b[108;6u" },
  
  { key = "Space", mods = "Control", chars = "\u0000" },
]
