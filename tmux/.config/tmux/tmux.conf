# ============================================
#   Some options
# ============================================
set-option -g escape-time 0

set-option -g display-time 2000

set-option -g status-interval 5
# increase scrollback buffer size
set-option -g history-limit 100000
# vi-mode
set-window-option -g mode-keys vi
set-option -g  status-keys vi

set-option -g focus-events on

set-option -sa terminal-overrides ",xterm*:Tc"

set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'

set-window-option -g aggressive-resize on

set -g mouse on

set-option -g status-position top

# index from 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on


# ============================================
#   Unbinds
# ============================================

unbind C-b
unbind r
unbind '"'
unbind %
unbind &
unbind n
unbind p
unbind M-Up
unbind M-Down
unbind M-Right
unbind M-Left
unbind C-Up
unbind C-Down
unbind C-Right
unbind C-Left


# ============================================
#   Binds
# ============================================

# Set prefix
set -g prefix C-Space
bind C-Space send-prefix

# Reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message "config reloaded"

# Copy mode : <prefix> + [
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

bind X confirm-before -p " Kill window? (y/n)" "kill-window"
bind C-x confirm-before -p " Kill other windows? (y/n)" "kill-window -a"

# Split panes
bind h split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# Resize panes 
bind-key -r -T prefix H resize-pane -L 3
bind-key -r -T prefix J resize-pane -D 3
bind-key -r -T prefix K resize-pane -U 3
bind-key -r -T prefix L resize-pane -R 3


# ============================================
#   Plugins
# ============================================

# TPM lives in ~/.config/tmux/tpm, plugins are installed to ~/.config/tmux/plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '$HOME/.config/tmux/plugins'
set -g @plugin 'tmux-plugins/tpm'


# navig between panes Ctrl + Shift + hjkl
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @vim_navigator_mapping_left  'C-S-h'
set -g @vim_navigator_mapping_down  'C-S-j'
set -g @vim_navigator_mapping_up    'C-S-k'
set -g @vim_navigator_mapping_right 'C-S-l'
set -g @vim_navigator_mapping_prev ''


# Popup with the real keybindings (defaults + your own): prefix + ?
set -g @cheatsheet-key '?'
set -g @cheatsheet-key-table 'prefix'
set -g @cheatsheet-bundled 'off' # only live bindings, labeled with the actual prefix
set -g @plugin 'gudetimes1234/tmux-cheatsheet'


# set -g @plugin 'tmux-plugins/tmux-yank' ??


# ============================================
# Theme
# ============================================
# pacman -Sy bash bc coreutils git jq
set -g @plugin "janoamaral/tokyo-night-tmux"
set -g @tokyo-night-tmux_theme night   # night (default) | storm | moon | day
set -g @tokyo-night-tmux_show_git 1             # local git status
set -g @tokyo-night-tmux_show_path 1            # current path
set -g @tokyo-night-tmux_show_hostname 1        # machine hostname


# ============================================
# TPM entrypoint (must be the last line)
# ============================================
run '$HOME/.config/tmux/tpm/tpm'


# ============================================
#   Theme fixes
# ============================================

# Fix: tokyo-night drops "fill=" from the message styles.
# Without it tmux only repaints the text of messages / the command prompt,
# leaving pieces of the status line visible underneath (tmux >= 3.5).
# Colors match the "night" theme; adjust if you switch to storm/moon/day.
set -g message-style 'bg=#7aa2f7,fg=#2A2F41,fill=#7aa2f7'
set -g message-command-style 'bg=#2A2F41,fg=#7aa2f7,fill=#2A2F41'

# --- Active pane visibility ---
set -g pane-border-lines heavy
set -g pane-border-indicators both
set -g pane-border-style        'fg=#2A2F41'
set -g pane-active-border-style 'fg=#7aa2f7,bold'

set -g pane-border-status top
set -g pane-border-format '#{?pane_active,#[fg=#7aa2f7]#[bold],#[fg=#a9b1d6]} #{pane_index} #{?pane_active,#[fg=#1A1B26]#[bg=#7aa2f7]#[bold],#[fg=#a9b1d6]#[bg=#2A2F41]} #{pane_current_command} #[default] '
